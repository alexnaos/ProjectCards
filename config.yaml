# =============================================================================
# project-cards — конфигурация
# Все относительные пути — относительно vault_path.
# =============================================================================

# --- Vault -----------------------------------------------------------------
vault_path: "C:/test"
card_filename: "{{folder_name}}.md"
attachments_dir: "_attachments"

# =============================================================================
# ИСКЛЮЧЕНИЯ (что НЕ индексировать)
# Порядок проверки при обходе:
#   1. exclusions.exclude_paths      — точные относительные пути
#   2. exclusions.folder_names       — имена папок на любой глубине
#   3. exclusions.folder_globs       — glob по относительному пути папки
#   4. exclusions.folder_regex       — regex по относительному пути папки
#   5. exclusions.file_globs         — glob по имени/пути файла
#   6. exclusions.file_regex         — regex по имени/пути файла
#   7. exclusions.frontmatter_flag   — если в .md стоит exclude: true
# Если сработало любое правило — папка/файл пропускается.
# Все паттерны — Python glob (fnmatch) / re; регистр учитывается.
# =============================================================================
exclusions:

  # --- Точные пути (относительно vault_path) -------------------------------
  exclude_paths:
    # --- служебные ---
    - ".obsidian"
    - ".trash"
    - ".git"
    - ".smart-env"
    - ".GeoniCS Projects"

    # --- системные/шаблонные каталоги Vault ---
    - "_attachments"
    - "templates"
    - "Templates"

    # --- корневые папки Vault, не относящиеся к проектам ---
    - "Clippings"
    - "Obsidian Vault"
    - "Архивн"
    - "Загрузки"
    - "Проекты"
    - "СЗ"
    - "Скриншоты"
    - "СПДС"
    - "ССК"
    - "Я_док"

  # --- Имена папок на любой глубине ---------------------------------------
  folder_names:
    - ".obsidian"
    - ".trash"
    - ".git"
    - ".cache"
    - "node_modules"
    - "__pycache__"
    - "_attachments"
    - "_templates"
    - "templates"
    - "Templates"
    - "Attachments"

  # --- Glob по относительному пути папки ----------------------------------
  folder_globs:
    - "**/backup"
    - "**/backup/**"
    - "**/temp"
    - "**/tmp"
    - "**/.DS_Store"
    - "**/old_versions"
    - "**/versions/**"
    - "**/node_modules/**"
    - "**/.cache/**"
    - "**/_archive/**"
    - "**/_archived/**"
    - "**/*Архив*"               # Глоб на папки со словом Архив

  # --- Regex по относительному пути папки --------------------------------
  folder_regex:
    - '^\d{4}_Архив/'           # папки «2023_Архив»
    - '/_\d+$'                  # папки, оканчивающиеся на _1, _2...
    - '/(old|draft|temp|backup)$'
    - '(?i)архив'               # Исключает любые папки со словом Архив (регистр не важен)
    - '(?i)archive'             # Исключает любые папки со словом Archive

  # --- Исключения отдельных файлов ---------------------------------------
  file_globs:
    - "*.tmp"
    - "*.bak"                   # Временные файлы
    - "~$*"                     # временные Word/Excel
    - ".DS_Store"
    - "Thumbs.db"
    - "*.log"
    - "*.lnk"
    - "*.crdownload"            # недокачанные
    - "*.part"
    - ".cache.json"

  # --- Regex по имени/пути файла -----------------------------------------
  file_regex:
    - '(?i).*\.bak$'            # Дублируем .bak через regex для надежности
    - '^~\$.*'                  # ещё раз, но через regex
    - '.*\.sync-conflict-.*'    # Syncthing-конфликты
    - '.*\.conflict-.*'         # Resilio/Dropbox-конфликты
    - '^\.~lock\..*#$'          # LibreOffice lock-файлы

  # --- Через frontmatter карточки ----------------------------------------
  frontmatter_flag:
    enabled: true
    key: "exclude"

  # --- Лимиты по размеру и количеству ------------------------------------
  size_limits:
    enabled: true
    max_folder_size_mb: 5000     
    max_files_per_folder: 5000   
    max_file_size_mb: 200        

ignore_folders: []

# --- Определение папок-проектов --------------------------------------------
project_detection:
  min_files: 1
  ignore_if_only_card: true
  max_depth: 0

# --- Обрабатываемые расширения ---------------------------------------------
supported_extensions:
  text:   [".md", ".txt", ".csv", ".json"]
  office: [".docx", ".xlsx", ".pptx"]
  pdf:    [".pdf"]
  image:  [".jpg", ".jpeg", ".png", ".webp", ".gif"]

# --- LLM -------------------------------------------------------------------
llm:
  enabled: true
  temperature: 0.2
  max_tokens: 400
  max_chars_per_file: 8000
  max_total_chars: 60000
  system_prompt: >-
    Ты — ассистент архитектурного бюро. На основе документов проекта
    сформируй краткое техническое описание объекта (2–4 предложения):
    тип объекта, этажность, конструктив, материалы, архитектурный стиль,
    назначение. Без воды, только факты из документов. Если данных
    недостаточно — напиши "Описание не сформировано".
  preserve_existing_description: true

# --- Fallback-суммаризация без LLM -----------------------------------------
fallback_summary:
  enabled: true
  top_terms: 15
  min_term_length: 4
  stop_words:
    # Исправлены кракозябры на нормальный русский язык
    - "и"
    - "в"
    - "на"
    - "с"
    - "по"
    - "для"
    - "из"
    - "к"
    - "о"
    - "от"
    - "до"
    - "не"
    - "что"
    - "как"
    - "это"
    - "или"
    - "при"
    - "без"
    - "под"
    - "над"
    - "the"
    - "and"
    - "of"
    - "to"
    - "in"
    - "for"
    - "on"
    - "with"
    - "is"
    - "are"
    - "this"
    - "that"

# --- Адрес -----------------------------------------------------------------
address:
  enabled: true
  # Паттерны отсюда больше не используются, так как мы переписали logic в address.py
  # Но оставим для совместимости
  patterns: [] 
  min_length: 8
  max_candidates: 50

# --- Изображения -----------------------------------------------------------
images:
  cover_keywords: ["фасад", "facade", "render", "вид", "photo", "обложка",
                   "general", "перспектива", "visual"]
  plan_keywords: ["план", "plan", "генплан", "genplan", "фасад", "facade",
                  "разрез", "section", "схема", "scheme"]
  max_plan_images: 6
  pdf_render:
    enabled: true
    dpi: 150
    match_text: true
    max_pages_per_file: 3
  web_search:
    enabled: false
    provider: "serpapi"
    max_results: 5
    only_if_local_missing: true

# --- Вложения / slug -------------------------------------------------------
attachments:
  slug_mode: "translit"
  slug_max_length: 64
  overwrite: false

# --- Кэш и инкрементальность -----------------------------------------------
cache:
  enabled: true
  file: ".cache.json"
  skip_unchanged: true

# --- Значения по умолчанию ------------------------------------------------
defaults:
  publish: false
  published: null
  rating: null
  author: ""
  source: ""
  tags: ["project"]
  keyword_tags:
    "жилой": "residential"
    "жилое": "residential"
    "офис": "office"
    "офисный": "office"
    "промышленн": "industrial"
    "реконструкц": "reconstruction"
    "новое строительство": "new-build"
    "проектная документация": "design-docs"
    "рабочая документация": "working-docs"

# --- Логирование -----------------------------------------------------------
logging:
  level: "INFO"
  output: "both"
  file: "project-cards.log"
  rotate_mb: 10
  backups: 3

# --- Сеть ------------------------------------------------------------------
http:
  timeout: 30
  user_agent: "project-cards/1.0 (+obsidian-vault-bot)"
  verify_ssl: true