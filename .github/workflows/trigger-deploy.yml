name: Trigger MyFlask deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Send repository_dispatch to MyFlask
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.MYFLASK_DEPLOY_PAT }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/alexnaos/MyFlask/dispatches" \
            -d '{"event_type":"deploy"}'
        env:
          MYFLASK_DEPLOY_PAT: ${{ secrets.MYFLASK_DEPLOY_PAT }}
